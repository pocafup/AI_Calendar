<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calendar - Sign Up</title>

    <!-- DESIGN UPDATE: TailwindCSS added (no logic changed) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-blue-200 flex items-center justify-center min-h-screen">

    <!-- DESIGN UPDATE: Tailwind container styling applied -->
    <div class="login-container bg-white p-10 rounded-2xl shadow-xl max-w-md w-full">

        <h2 class="text-3xl font-bold text-center text-blue-600 mb-6">
            Create Your Account
        </h2>

        {% if error %}
        <!-- DESIGN UPDATE: Styled error message -->
        <div class="bg-red-100 text-red-700 border border-red-300 rounded-lg p-3 mb-4">
            {{ error }}
        </div>
        {% endif %}

        <!-- FORM (NO logic modified, only styled) -->
        <form action="{{ url_for('signup') }}" method="POST" class="space-y-5">

            <div>
                <label class="block text-gray-600 mb-1">Username</label>
                <input type="text" name="username" required
                       class="w-full px-4 py-2 border rounded-lg focus:outline-blue-400">
            </div>

            <div>
                <label class="block text-gray-600 mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-2 border rounded-lg focus:outline-blue-400">
            </div>

            <div>
                <label class="block text-gray-600 mb-1">Confirm Password</label>
                <input type="password" name="confirm" required
                       class="w-full px-4 py-2 border rounded-lg focus:outline-blue-400">
            </div>

            <!-- DESIGN UPDATE: Styled button -->
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                Sign Up
            </button>
        </form>

        <!-- DESIGN UPDATE: footer text -->
        <p class="text-center text-gray-600 text-sm mt-6">
            Already have an account?
            <a href="{{ url_for('login') }}" class="text-blue-600 font-semibold hover:underline">Login</a>
        </p>

    </div>
</body>
</html>
