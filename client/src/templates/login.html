<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calendar - Login</title>

    <!-- DESIGN UPDATE: TailwindCSS added only for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-blue-200 flex items-center justify-center min-h-screen">

    <!-- DESIGN UPDATE: Added Tailwind container styling -->
    <div class="login-container bg-white p-10 rounded-2xl shadow-xl max-w-md w-full">

        <h2 class="text-3xl font-bold text-center text-blue-600 mb-6">
            AI Calendar Login
        </h2>

        {% if error %}
        <!-- DESIGN UPDATE: Error box styled -->
        <div class="bg-red-100 text-red-700 border border-red-300 rounded-lg p-3 mb-4">
            {{ error }}
        </div>
        {% endif %}

        <!-- FORM: (No logic modified, only styling added) -->
        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">

            <div>
                <label for="username" class="block text-gray-600 mb-1">Username</label>
                <!-- DESIGN UPDATE: Tailwind input styling -->
                <input type="text" id="username" name="username" required
                       class="w-full px-4 py-2 border rounded-lg focus:outline-blue-400">
            </div>

            <div>
                <label for="password" class="block text-gray-600 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2 border rounded-lg focus:outline-blue-400">
            </div>

            <!-- DESIGN UPDATE: Styled button -->
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                Login
            </button>
        </form>

        <!-- DESIGN UPDATE: Styled footer text -->
        <div class="text-center text-gray-600 text-sm mt-5">
            Don’t have an account?  
            <a href="{{ url_for('register') }}" class="text-blue-600 font-semibold hover:underline">
                Sign up
            </a>
        </div>

    </div>
</body>
</html>
