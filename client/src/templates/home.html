<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Calendar - Home</title>

    <!-- DESIGN UPDATE: TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-blue-200 min-h-screen">

    <!-- Top Navigation -->
    <!-- DESIGN UPDATE: Navigation bar added -->
    <header class="w-full bg-white shadow p-5 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-600">AI Calendar</h1>

        <nav class="space-x-6">
            <a href="/login" class="text-gray-700 hover:text-blue-600">Login</a>
            <a href="/signup" class="text-gray-700 hover:text-blue-600">Sign Up</a>
            <a href="/dashboard" class="text-gray-700 hover:text-blue-600">Calendar</a>
            <a href="/analytics" class="text-gray-700 hover:text-blue-600">Analytics</a>
        </nav>
    </header>

    <!-- Main Contents -->
    <main class="flex flex-col items-center text-center mt-20">

        <h2 class="text-4xl font-bold text-gray-800 mb-4">Welcome to AI Calendar</h2>

        <p class="text-gray-600 text-lg max-w-xl">
            Your personal productivity hub — manage tasks, track deadlines, and view your calendar with ease.
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-16">

            <!-- Login Card -->
            <a href="/login"
               class="bg-white shadow-lg rounded-xl p-8 hover:scale-105 transition cursor-pointer w-64">
                <h3 class="text-xl font-bold text-blue-600 mb-2">Login</h3>
                <p class="text-gray-600 text-sm">Access your personal calendar and tasks.</p>
            </a>

            <!-- Signup Card -->
            <a href="/signup"
               class="bg-white shadow-lg rounded-xl p-8 hover:scale-105 transition cursor-pointer w-64">
                <h3 class="text-xl font-bold text-blue-600 mb-2">Sign Up</h3>
                <p class="text-gray-600 text-sm">Create your account and start organizing.</p>
            </a>

        </div>
    </main>

</body>
</html>
