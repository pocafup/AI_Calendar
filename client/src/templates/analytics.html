<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics</title>

    <!-- DESIGN UPDATE -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center">

    <!-- Header -->
    <header class="w-full bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">AI Calendar - Analytics</h1>
        <a href="/dashboard" class="text-gray-700 hover:text-blue-600">Back to Calendar</a>
    </header>

    <!-- Analytics Container -->
    <main class="w-full max-w-6xl mt-10 p-8 bg-white rounded-xl shadow">

        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Your Productivity Overview</h2>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">

            <div class="p-6 bg-blue-50 rounded-xl shadow">
                <p class="text-gray-600 text-sm">Total Tasks</p>
                <p class="text-3xl font-bold text-blue-600">42</p>
            </div>

            <div class="p-6 bg-red-50 rounded-xl shadow">
                <p class="text-gray-600 text-sm">High Priority</p>
                <p class="text-3xl font-bold text-red-500">12</p>
            </div>

            <div class="p-6 bg-green-50 rounded-xl shadow">
                <p class="text-gray-600 text-sm">Completed</p>
                <p class="text-3xl font-bold text-green-500">27</p>
            </div>
        </div>

        <!-- Graph Placeholder -->
        <div class="bg-gray-50 rounded-xl h-64 flex items-center justify-center text-gray-500">
            <!-- DESIGN UPDATE -->
            Monthly tasks graph (coming soon)
        </div>
    </main>
</body>
</html>
