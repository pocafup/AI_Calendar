<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Calendar - Dashboard</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Inject backend URL + current user FROM FLASK -->
    <script>
        const BACKEND_URL = "{{ backend_url }}";
        const CURRENT_USER = "{{ username }}";
        console.log("[Calendar.html] BACKEND_URL =", BACKEND_URL);
        console.log("[Calendar.html] CURRENT_USER =", CURRENT_USER);
    </script>

    <!-- Our JS -->
    <script src="{{ url_for('static', filename='calendar.js') }}" defer></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center">

    <!-- HEADER -->
    <header class="w-full bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">AI Calendar</h1>

        <nav class="space-x-4 flex items-center">
            <span class="text-gray-500 text-sm">
                Logged in as <span class="font-semibold">{{ username }}</span>
            </span>
            <a href="/dashboard" class="text-blue-600 font-semibold">Dashboard</a>
            <a href="/priority" class="text-gray-700 hover:text-blue-600">Priority</a>
            <a href="/analytics" class="text-gray-700 hover:text-blue-600">Analytics</a>
            <a href="/logout" class="text-gray-700 hover:text-blue-600">Logout</a>
        </nav>
    </header>

    <!-- MAIN PANEL -->
    <main class="bg-white shadow-lg rounded-xl p-8 w-full max-w-4xl mt-10">

        <!-- Month Navigation -->
        <div class="flex justify-between items-center mb-6">
            <button id="prev" class="px-4 py-2 bg-blue-500 text-white rounded-lg">◀</button>
            <h2 id="month-name" class="text-2xl font-semibold text-gray-800"></h2>
            <button id="next" class="px-4 py-2 bg-blue-500 text-white rounded-lg">▶</button>
        </div>

        <!-- Week Header -->
        <div class="grid grid-cols-7 gap-2 text-gray-600 font-semibold mb-2">
            <div class="text-center">Sun</div>
            <div class="text-center">Mon</div>
            <div class="text-center">Tue</div>
            <div class="text-center">Wed</div>
            <div class="text-center">Thu</div>
            <div class="text-center">Fri</div>
            <div class="text-center">Sat</div>
        </div>

        <!-- Calendar Grid -->
        <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>

        <!-- Add Task Button -->
        <div class="flex justify-end mt-6">
            <button id="add-task-btn"
                    class="px-5 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700">
                + Add Task
            </button>
        </div>

        <!-- Task List -->
        <h3 class="text-xl font-semibold mt-6 mb-3">Task List</h3>
        <div id="task-list" class="min-h-[120px]">
            <p class="text-gray-500">Select a date to view tasks.</p>
        </div>
    </main>

    <!-- TASK MODAL -->
    <div id="task-modal"
         class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">

        <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm">
            <h3 class="text-lg font-bold mb-3">Add New Task</h3>

            <p class="text-gray-600 mb-2">
                Selected Date:
                <span id="modal-date" class="font-semibold"></span>
            </p>

            <form id="task-form" class="space-y-4">

                <!-- Task Title -->
                <label class="block text-gray-600">Task Title</label>
                <input id="task-text" type="text" placeholder="Short title (e.g. CS assignment 3)"
                       class="w-full px-3 py-2 border rounded-lg" required />

                <!-- Task Description -->
                <label class="block text-gray-600">Task Description</label>
                <textarea id="task-description" rows="3"
                          placeholder="Details, requirements, links, etc."
                          class="w-full px-3 py-2 border rounded-lg"></textarea>

                <!-- Priority -->
                <label class="block text-gray-600">Priority (your choice)</label>
                <select id="task-priority" class="w-full px-3 py-2 border rounded-lg">
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>

                <!-- Due Date -->
                <label class="block text-gray-600">Due Date</label>
                <input id="task-due-date" type="date"
                       class="w-full px-3 py-2 border rounded-lg" />

                <!-- Deadline Time -->
                <label class="block text-gray-600">Deadline Time</label>
                <input id="task-deadline" type="time"
                       class="w-full px-3 py-2 border rounded-lg" />

                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()"
                            class="px-4 py-2 bg-gray-300 rounded-lg">
                        Cancel
                    </button>

                    <button id="task-save-btn" type="submit"
                            class="px-4 py-2 bg-blue-600 text-white rounded-lg">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
