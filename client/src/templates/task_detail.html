<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Detail</title>

    <!-- DESIGN UPDATE: TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center">

    <!-- Header -->
    <header class="w-full bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">AI Calendar</h1>
        <a href="/dashboard" class="text-gray-700 hover:text-blue-600">Back to Calendar</a>
    </header>

    <!-- Task Detail Card -->
    <main class="bg-white shadow-lg rounded-xl p-8 w-full max-w-xl mt-10">

        <!-- DESIGN UPDATE: Title -->
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Task Detail</h2>

        <!-- Task Info (filled by backend or JS later) -->
        <div class="space-y-4">

            <div>
                <h3 class="text-gray-600 font-semibold">Task Title</h3>
                <p class="text-gray-800">Prepare project slides</p>
            </div>

            <div>
                <h3 class="text-gray-600 font-semibold">Priority</h3>
                <span class="px-3 py-1 rounded text-white bg-red-500">High</span>
            </div>

            <div>
                <h3 class="text-gray-600 font-semibold">Due Date</h3>
                <p class="text-gray-800">2025-12-07</p>
            </div>

            <div>
                <h3 class="text-gray-600 font-semibold">Deadline Time</h3>
                <p class="text-gray-800">17:30</p>
            </div>

            <div>
                <h3 class="text-gray-600 font-semibold">Notes</h3>
                <p class="text-gray-800">Review with team before final submission.</p>
            </div>

        </div>

        <!-- Buttons -->
        <div class="flex justify-end space-x-3 mt-8">
            <a href="/edit_task"
               class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                Edit
            </a>

            <button class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                Delete
            </button>
        </div>
    </main>
</body>
</html>
